services:
  agent-compliance:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fireguard-agent-compliance
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002" 
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fireguard-net

networks:
  fireguard-net:
    external: true
    name: fireguard-vector-store_fireguard-net
